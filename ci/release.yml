# Modèle de workflow de release avec signature optionnelle.
#
# Pour l'activer :
#   1. Copier ce fichier dans .github/workflows/release.yml
#   2. Ajouter les secrets décrits dans SIGNING.md
#   3. Pousser un tag vX.Y.Z
#
# Sans les secrets Windows/Apple, les binaires sont simplement non signés :
# le workflow reste utilisable pour produire les empreintes et la release.
#
# Ce fichier vit dans ci/ et non dans .github/workflows/ pour pouvoir être
# versionné même avec un token GitHub limité au scope "repo".

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/braise-windows-amd64.exe .

      - name: Signer (optionnel)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Warning "WINDOWS_CERT_PFX_BASE64 absent : binaire non signé."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "braise.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          ./scripts/sign-windows.ps1 -Path bin/braise-windows-amd64.exe -PfxPath $pfx -PfxPassword $env:WINDOWS_CERT_PASSWORD
          Remove-Item $pfx -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bin/braise-windows-amd64.exe
          if-no-files-found: error

  macos:
    name: macOS arm64 + amd64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "bin/braise-darwin-$arch" .
          done

      - name: Signer, emballer et notarier (optionnel)
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERT_P12_BASE64:-}" ]]; then
            echo "::warning::APPLE_CERT_P12_BASE64 absent : binaires non signés."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            ./scripts/sign-macos.sh "bin/braise-darwin-$arch" "$version"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            bin/braise-darwin-*
            dist/*.pkg
          if-no-files-found: error

  linux:
    name: Linux amd64 + arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "bin/braise-linux-$arch" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: bin/braise-linux-*
          if-no-files-found: error

  release:
    name: Empreintes et release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Empreintes SHA-256
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/checksums.sh
          ./scripts/checksums.sh dist

      - name: Signature Sigstore (optionnelle)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
            chmod +x cosign
            ./cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
          else
            echo "::warning::OIDC indisponible : checksums.txt non signé avec cosign."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
